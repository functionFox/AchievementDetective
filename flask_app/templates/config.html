<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Achievement Detective Config</title>
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>
<body class="bg-body-tertiary">
    <main class="container py-4">
        <h1>Achievement Detective Config</h1>

            <div class="row g-4">
            <div class="col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title mb-3">Game Settings</h5>

                    <label for="game-select">Game</label>
                    <select id="game-select" class="form-select">
                        <option value="">Loading games...</option>
                    </select>

                    <label for="display-mode-select">Display Mode</label>
                    <select id="display-mode-select" class="form-select">
                        <option value="obelisk">Obelisk</option>
                        <option value="ticker">Ticker</option>
                    </select>

                    <label for="obelisk-angle-input" class="form-label mt-3">Obelisk Angle</label>
                    <input
                        id="obelisk-angle-input"
                        class="form-range"
                        type="range"
                        min="0"
                        max="70"
                        step="1"
                        value="63"
                    >

                    <label for="ticker-strip-color-input">Ticker Bar Color</label>
                    <input id="ticker-strip-color-input" class="form-select" type="color" value="#141a28">

                    <label for="ticker-strip-opacity-input">Ticker Bar Opacity</label>
                    <input id="ticker-strip-opacity-input" class="form-range" type="range" min="0" max="100" step="1" value="78">
                    </div>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title mb-3">Text Settings</h5>

                        <label for="text-color-input">Text Color</label>
                        <input id="text-color-input" class="form-select" type="color" value="#000000">

                        <label for="text-stroke-width-input">Stroke Width</label>
                        <input id="text-stroke-width-input" class="form-range" type="range" min="0" max="4" step="1" value="0">

                        <label for="text-stroke-color-input">Stroke Color</label>
                        <input id="text-stroke-color-input" class="form-select" type="color" value="#ffffff">
                    </div>
                </div>
            </div>

            <div class="mt-3 d-flex gap-2 flex-wrap">
                <button id="apply-game-button" type="button">Apply</button>
                <button id="refresh-game-button" type="button">Refresh Achievements</button>
                <button id="rescan-games-button" type="button">Rescan Steam Games</button>
            </div>
        </div>

            <h2>Active Game</h2>
            <pre id="active-game-output">No active game selected.</pre>

            <h2>Achievements</h2>
            <pre id="achievements-output">No achievement data loaded.</pre>

            <script src="{{ url_for('static', filename='app.js') }}"></script>
    </main>
</body>
</html>
